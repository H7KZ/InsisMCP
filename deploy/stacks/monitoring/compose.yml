# Shared monitoring: metrics, logs, alerting, dashboards. Started by hand (see deploy/README.md).
#
# Alloy scrapes everything and pushes to Prometheus; Prometheus evaluates rules.yml and alerts via Alertmanager to
# Discord; Alloy also ships logs to Loki; Grafana shows both at https://<GRAFANA_HOST>/grafana.

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Low-cardinality usage metrics are kept for the whole thesis period
      - --storage.tsdb.retention.time=400d
      # Alloy pushes what it scrapes
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    networks:
      - monitoring
    mem_limit: 768m

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    environment:
      DISCORD_ALERTS_WEBHOOK: ${DISCORD_ALERTS_WEBHOOK:?}
      DISCORD_ALERTS_DEV_WEBHOOK: ${DISCORD_ALERTS_DEV_WEBHOOK:?}
    # Alertmanager reads webhook URLs only from files: write them from the environment at start
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /tmp/webhooks &&
        printf %s "$$DISCORD_ALERTS_WEBHOOK" > /tmp/webhooks/alerts &&
        printf %s "$$DISCORD_ALERTS_DEV_WEBHOOK" > /tmp/webhooks/alerts-dev &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager:/alertmanager
    networks:
      - monitoring
    mem_limit: 128m

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./loki:/etc/loki:ro
      - loki:/loki
    networks:
      - monitoring
    mem_limit: 512m

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command: [run, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    environment:
      PG_MONITOR_PASSWORD: ${PG_MONITOR_PASSWORD:?}
    # Host and container metrics need read access to the host
    pid: host
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy:/var/lib/alloy/data
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /run/udev:/run/udev:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    # On every network with something to scrape
    networks:
      - monitoring
      - edge
      - db
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:?}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # TODO(dashboards): overview and usage dashboards as files plus a dashboard provider (see deploy/README.md)
      - grafana:/var/lib/grafana
    networks:
      - monitoring
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST:?}`) && PathPrefix(`/grafana`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    mem_limit: 256m

networks:
  monitoring:
  edge:
    external: true
  db:
    external: true

volumes:
  prometheus:
  alertmanager:
  loki:
  alloy:
  grafana:
