# One app environment (prod or dev): the MCP server and the ETL. Never edited on the host.
#
# Variables come from two env files:
#   /etc/insis-mcp/<env>.env   hand-made secrets and settings (deploy/env/app.env.example)
#   deploy state file          MCP_IMAGE, ETL_IMAGE, GIT_SHA (TODO: written by bin/deploy.sh, see deploy/README.md)
#
# TODO(images): mcp/Dockerfile and etl/Dockerfile; CI pushes ghcr.io/h7kz/insis-{mcp,etl}:sha-<commit>

services:
  mcp:
    image: ${MCP_IMAGE:?}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?}
      DATABASE_URL: postgres://${MCP_DB_USER:?}:${MCP_DB_PASSWORD:?}@postgres:5432/${PG_DATABASE:?}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    networks:
      - edge
      - db
    # TODO(health): HEALTHCHECK on /health in mcp/Dockerfile; Traefik routes only to healthy containers
    # List form: compose interpolates values, not mapping keys
    labels:
      - traefik.enable=true
      - traefik.http.routers.mcp-${APP_ENV}.rule=Host(`${PUBLIC_HOST:?}`)
      # HTTPS with an automatic Let's Encrypt certificate for the Host above (see the platform stack)
      - traefik.http.routers.mcp-${APP_ENV}.entrypoints=websecure
      - traefik.http.routers.mcp-${APP_ENV}.middlewares=mcp-${APP_ENV}-ratelimit,secure-headers@file
      # TODO: set to the server's port once mcp/ listens
      - traefik.http.services.mcp-${APP_ENV}.loadbalancer.server.port=3000
      # Per client IP: Traefik sees the real address, there is no proxy in front
      - traefik.http.middlewares.mcp-${APP_ENV}-ratelimit.ratelimit.average=${RATE_LIMIT_AVERAGE:-60}
      - traefik.http.middlewares.mcp-${APP_ENV}-ratelimit.ratelimit.burst=${RATE_LIMIT_BURST:-100}
      - insis.env=${APP_ENV}
      # TODO(metrics): - insis.metrics.port=<port> once the server exposes /metrics; Alloy then scrapes it.
      # /metrics must stay on that internal port and never be routed by Traefik.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 512m

  # One-shot: started by the ETL timer or a deploy (TODO: bin/etl-run.sh), never by `up`
  etl:
    image: ${ETL_IMAGE:?}
    profiles: [etl]
    environment:
      DATABASE_URL: postgres://${ETL_DB_USER:?}:${ETL_DB_PASSWORD:?}@postgres:5432/${PG_DATABASE:?}
      READER_ROLE: ${MCP_DB_USER:?}
      ORACLE_USER: ${ORACLE_USER:?}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?}
      ORACLE_CONNECT_STRING: ${ORACLE_CONNECT_STRING:?}
    networks:
      - db
      # Internet access for isis-db2 (the db network has none)
      - default
    labels:
      - insis.env=${APP_ENV}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 1g

networks:
  edge:
    external: true
  db:
    external: true
